<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>API Materiales 2026 - Aguirre Lautaro</title>
    <!-- Bootstrap 5 desde CDN: nos da los estilos de tablas, pestañas, botones y modales -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="bg-light">

    <!-- barra de navegacion -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <span class="navbar-brand mb-0 h1">
                <i class="bi bi-box-seam"></i> Gestión de Materiales
            </span>
            <span class="navbar-text">APIMateriales2026</span>
        </div>
    </nav>

    <div class="container">

        <!-- pestañas (para no hacer varias html) -->
        <ul class="nav nav-tabs" id="tabs" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="tab-rubros" data-bs-toggle="tab" data-bs-target="#panel-rubros"
                    type="button" role="tab">
                    <i class="bi bi-tags"></i> Rubros
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-materiales" data-bs-toggle="tab" data-bs-target="#panel-materiales"
                    type="button" role="tab">
                    <i class="bi bi-bricks"></i> Materiales
                </button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="tab-productos" data-bs-toggle="tab" data-bs-target="#panel-productos"
                    type="button" role="tab">
                    <i class="bi bi-cart"></i> Productos
                </button>
            </li>
        </ul>

        <div class="tab-content bg-white border border-top-0 rounded-bottom p-4 mb-5">

            <!--  PANEL RUBROS  -->
            <div class="tab-pane fade show active" id="panel-rubros" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0">Rubros</h4>
                    <!-- Este botón abre el modal en modo "crear" (lo maneja app.js) -->
                    <button class="btn btn-primary" id="btn-nuevo-rubro">
                        <i class="bi bi-plus-lg"></i> Agregar rubro
                    </button>
                </div>
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th style="width:80px">ID</th>
                            <th>Descripción</th>
                            <th style="width:160px">Acciones</th>
                        </tr>
                    </thead>
                    <!-- app.js llena este tbody con los datos de GET api/Rubros -->
                    <tbody id="tbody-rubros"></tbody>
                </table>
            </div>

            <!--  PANEL MATERIALES  -->
            <div class="tab-pane fade" id="panel-materiales" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0">Materiales</h4>
                    <button class="btn btn-primary" id="btn-nuevo-material">
                        <i class="bi bi-plus-lg"></i> Agregar material
                    </button>
                </div>
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th style="width:80px">ID</th>
                            <th>Descripción</th>
                            <th>Rubro</th> <!-- Esta columna sale del Include: material.rubro.descripcion -->
                            <th style="width:140px">Precio costo</th>
                            <th style="width:160px">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-materiales"></tbody>
                </table>
            </div>

            <!--  PANEL PRODUCTOS  -->
            <div class="tab-pane fade" id="panel-productos" role="tabpanel">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h4 class="mb-0">Productos</h4>
                    <button class="btn btn-primary" id="btn-nuevo-producto">
                        <i class="bi bi-plus-lg"></i> Agregar producto
                    </button>
                </div>
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th style="width:80px">ID</th>
                            <th>Descripción</th>
                            <th style="width:140px">Costo Total</th>
                            <th style="width:160px">Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-productos"></tbody>
                </table>
            </div>

        </div>
    </div>

    <!--  MODAL RUBRO (sirve para crear Y editar)  -->
    <div class="modal fade" id="modal-rubro" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="titulo-modal-rubro">Rubro</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <!-- Campo oculto: guarda el id cuando estamos editando (vacío = crear) -->
                    <input type="hidden" id="rubro-id">
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <input type="text" class="form-control" id="rubro-descripcion" placeholder="Ej: Construcción">
                        <div class="invalid-feedback" id="error-rubro-descripcion"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btn-guardar-rubro">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL MATERIAL  -->
    <div class="modal fade" id="modal-material" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="titulo-modal-material">Material</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="material-id">
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <input type="text" class="form-control" id="material-descripcion"
                            placeholder="Ej: Cemento x 50kg">
                        <div class="invalid-feedback" id="error-material-descripcion"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Rubro</label>
                        <!-- app.js llena este select con GET api/Rubros (la relación en acción) y con los materiales asociados por medio de cargarSelectRubros -->
                        <select class="form-select" id="material-rubro"></select>
                        <div class="invalid-feedback" id="error-material-rubro"></div>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Precio costo</label>
                        <input type="number" class="form-control" id="material-precio" min="0" step="0.01">
                        <div class="invalid-feedback" id="error-material-precio"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btn-guardar-material">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!--  MODAL PRODUCTO  -->
    <div class="modal fade" id="modal-producto" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="titulo-modal-producto">Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="hidden" id="producto-id">
                    <div class="mb-3">
                        <label class="form-label">Descripción</label>
                        <input type="text" class="form-control" id="producto-descripcion"
                            placeholder="Ej: Pared de ladrillo">
                        <div class="invalid-feedback" id="error-producto-descripcion"></div>
                    </div>
                    <!-- Costo total -->
                    <div class="mb-3">
                        <label class="form-label">Costo Total</label>
                        <input type="number" class="form-control" id="producto-costo" min="0" step="0.01">
                        <div class="invalid-feedback" id="error-producto-costo"></div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" id="btn-guardar-producto">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- modal de composición -->
    <div class="modal fade" id="modal-composicion" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="titulo-modal-composicion">Composición del Producto</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body border-bottom">
                    <input type="hidden" id="composicion-producto-id">
                    <div class="row g-2 align-items-end">
                        <div class="col-5">
                            <label class="form-label" for="composicion-material">Material</label>
                            <select class="form-select" id="composicion-material"></select>
                        </div>
                        <div class="col-3">
                            <label class="form-label" for="composicion-cantidad">Cantidad</label>
                            <input type="number" class="form-control" id="composicion-cantidad" min="0.01" step="0.01"
                                value="1">
                        </div>
                        <div class="col-4 d-grid">
                            <button type="button" class="btn btn-success" id="btn-agregar-composicion">
                                <i class="bi bi-plus-lg"></i> Agregar material
                            </button>
                        </div>
                    </div>
                    <div class="invalid-feedback d-block" id="error-composicion"></div>
                </div>
                <div class="modal-body">
                    <table class="table">
                        <thead>
                            <tr>
                                <th>Material</th>
                                <th>Cantidad</th>
                                <th>Precio Unitario</th>
                                <th>Subtotal</th>
                            </tr>
                        </thead>
                        <tbody id="tbody-composicion">
                        </tbody>
                    </table>
                    <div class="d-flex justify-content-end align-items-center gap-2 px-3 pb-3">
                        <label class="form-label mb-0 fw-bold" for="composicion-total">Costo total del producto:</label>
                        <input type="text" class="form-control" id="composicion-total" style="max-width:160px" disabled>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAL CONFIRMAR ELIMINACIÓN (compartido por los 3 modelos) -->
    <div class="modal fade" id="modal-confirmar" tabindex="-1">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-danger text-white">
                    <h5 class="modal-title"><i class="bi bi-exclamation-triangle"></i> Confirmar eliminación</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p id="confirmar-mensaje" class="mb-0"></p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-danger" id="btn-confirmar-eliminar">Eliminar</button>
                </div>
            </div>
        </div>
    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="validaciones.js"></script>
    <script src="app.js"></script>
</body>

</html>
